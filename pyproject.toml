[project]
name = "nanobot-switch"
version = "0.1.0"
description = "Standalone one-click provider switch and health checker for nanobot"
requires-python = ">=3.11"
readme = "README.md"
authors = [
  { name = "nanobot-switch contributors" }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "litellm>=1.81.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
nanobot-switch = "nanobot_switch.cli:app"

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nanobot_switch"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
